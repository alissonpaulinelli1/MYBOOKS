<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyMagicStoryBooks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>✨ MyMagicStoryBooks</h1>
  <p>Turn your child into the hero of a magical story</p>
</header>

<!-- ================= PREVIEW FORM ================= -->
<section class="previewForm">
  <input id="childName" type="text" placeholder="Child's Name" />
  <input id="childAge" type="number" placeholder="Age" />

  <label class="filePick">
    Upload Photo
    <input id="kidPhoto" type="file" accept="image/*" />
  </label>

  <button id="generateBtn">Create Preview</button>
</section>

<!-- ================= BOOK PREVIEW ================= -->
<section class="preview" id="preview">

  <h2>Your Book Preview</h2>
  <p class="smallNote">Cover + 2 pages (demo). Next step is adding real AI illustrations.</p>

  <!-- ===== BEFORE / AFTER ===== -->
  <div class="ba">

    <!-- BEFORE -->
    <div class="baCol">
      <p class="baLabel">Before (Your Upload)</p>
      <img id="beforeImg" class="baImg" alt="Before upload">
    </div>

    <!-- AFTER -->
    <div class="baCol">
      <p class="baLabel">After (Book Style)</p>

      <!-- ✅ AFTER CARD CORRETO -->
      <div class="afterCard">
        <img id="afterImg" class="baImg" alt="After preview">
      </div>
    </div>

  </div>

  <!-- ===== COVER + PAGES ===== -->
  <div class="pages">

    <div class="page">
      <p class="pageTitle">Cover</p>
      <div class="previewCard small">
        <div class="fakePage">Generated cover</div>
      </div>
    </div>

    <div class="page">
      <p class="pageTitle">Page 1</p>
      <div class="previewCard small">
        <div class="fakePage">Generated page</div>
      </div>
    </div>

    <div class="page">
      <p class="pageTitle">Page 2</p>
      <div class="previewCard small">
        <div class="fakePage">Generated page</div>
      </div>
    </div>

  </div>

</section>

<footer class="footer">
  © 2026 MyMagicStoryBooks
</footer>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
